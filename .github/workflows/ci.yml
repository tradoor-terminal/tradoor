# Every push and pull request: Rust tests, the WASM engine, and the web app's
# type check, build and size budget. A push to main then ships: the image goes to
# GitHub Container Registry tagged with the commit, and the server switches to it.
name: CI and deploy

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a deploy halfway; superseded branch runs can go.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN: "0.2.128"
  BINARYEN: version_132

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.8"

      - name: Install wasm-bindgen and wasm-opt
        run: |
          curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN}/wasm-bindgen-${WASM_BINDGEN}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz -C /usr/local/bin --strip-components=1 "wasm-bindgen-${WASM_BINDGEN}-x86_64-unknown-linux-musl/wasm-bindgen"
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN}/binaryen-${BINARYEN}-x86_64-linux.tar.gz" \
            | sudo tar -xz -C /usr/local/bin --strip-components=2 "binaryen-${BINARYEN}/bin/wasm-opt"

      - name: Rust tests
        run: cargo test --workspace --exclude tradoor-wasm --locked

      # Lighter's signer for the order system is Lighter's own Go library, built to WebAssembly.
      - uses: actions/setup-go@v5
        with:
          go-version-file: signers/lighter/go.mod
          cache-dependency-path: signers/lighter/go.sum

      - name: Chart engine (WASM)
        run: ./scripts/build-wasm.sh

      - name: Web dependencies
        working-directory: web
        run: deno install

      - name: Web type check
        working-directory: web
        run: deno task check

      - name: Web tests
        working-directory: web
        run: deno task test

      - name: Web build
        working-directory: web
        run: deno task build

      - name: Bundle size budget
        working-directory: web
        run: deno task size

  deploy:
    name: Deploy
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        # Registry paths must be lowercase.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The repository variable SITE_URL (https://your-domain), for SEO tags and the
          # sitemap; unset is none.
          build-args: |
            SITE_URL=${{ vars.SITE_URL }}

      - name: SSH key
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Switch the server to this commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        # The key may run one thing there, /usr/local/bin/tradoor-deploy (deploy/tradoor-deploy,
        # installed by hand): it takes compose.yml and the image from this commit, and the
        # job's token on stdin, which can pull only while the job runs.
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "/usr/local/bin/tradoor-deploy $GITHUB_SHA $GHCR_USER $SITE_URL"
